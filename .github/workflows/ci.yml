name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # publish.yml runs this whole workflow for the tagged commit before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      # vitest needs Node 22 or later, the CLI itself runs on 20.
      - if: matrix.node != 20
        run: npm test
      # Packs the tarball and runs it through npx on a copy of test/fixtures/_project, so the parser has to load here.
      - run: npm run smoke

  # Fixture coverage uses exact SDK 3 rc.0 pins until the final release is enabled, then exact final packages.
  # Stubs and legacy peers make this fixture coverage only. check-sdk-compatibility.mjs installs strict examples.
  typecheck-expected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - id: sdk-mode
        run: |
          node --input-type=module -e "import { released } from './dist/data/versions.js'; console.log('mode=' + (released ? '--final' : '--rc'))" >> "$GITHUB_OUTPUT"
      - run: node scripts/typecheck-expected.mjs 2.12
      - run: node scripts/typecheck-expected.mjs 3 ${{ steps.sdk-mode.outputs.mode }}
      - run: node scripts/check-sdk-compatibility.mjs ${{ steps.sdk-mode.outputs.mode }}
