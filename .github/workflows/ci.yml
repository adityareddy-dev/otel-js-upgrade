name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # publish.yml runs this whole workflow for the tagged commit before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      # vitest needs Node 22 or later, the CLI itself runs on 20.
      - if: matrix.node != 20
        run: npm test
      - run: npm run smoke
